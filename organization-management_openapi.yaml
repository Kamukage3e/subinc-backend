components:
  schemas:
    OrgAuditLog:
      type: object
      properties:
        action:
          type: string
        actor_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
        details:
          type: string
        id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        org_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        target_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
    OrgDomain:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
        domain:
          type: string
        id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        org_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        verified:
          type: boolean
    OrgSettings:
      type: object
      properties:
        org_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        settings:
          type: string
        updated_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
    Organization:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
        id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        name:
          type: string
          example: John Doe
        owner_id:
          type: string
          example: 5f9d7a7a8b8e8f0d1c3a1b2f
        slug:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
          example: active
        updated_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
    OrganizationHandler:
      type: object
      properties:
        OrgAuditLogger:
          $ref: '#/components/schemas/OrgAuditLogger'
        OrgSettingsService:
          $ref: '#/components/schemas/OrgSettingsService'
        OrganizationService:
          $ref: '#/components/schemas/OrganizationService'
        ProjectService:
          type: object
          description: optional, may be nil
        RBACService:
          type: object
          description: optional, may be nil
        RateLimitService:
          type: object
          description: for distributed rate limiting
        Store:
          nullable: true
          $ref: '#/components/schemas/PostgresStore'
        UserService:
          type: object
          description: optional, may be nil
    PostgresStore:
      type: object
      properties:
        AuditLogger:
          type: object
        DB:
          type: object
          nullable: true
        ServerConfigService:
          type: object
          nullable: true
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: organization
    description: Operations related to Organization
