openapi: 3.1.0
info:
  title: SaaS Billing Management API
  version: 1.0.0
  description: Production-grade, real-world SaaS billing API. All endpoints are secure, RBAC-protected, auditable, and ready for CI/CD.
servers:
  - url: /api/v1/admin/billing-management
security:
  - bearerAuth: []
paths:
  /accounts/create:
    post:
      summary: Create billing account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts/update:
    put:
      summary: Update billing account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
