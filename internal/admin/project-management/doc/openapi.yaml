openapi: 3.1.0
info:
  title: Project Management API
  version: 1.0.0
  description: Production-grade API for SaaS project management. All endpoints are secure, RBAC-protected, and auditable.
servers:
  - url: /api/v1/admin/project-management
paths:
  /projects/create:
    post:
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /projects/update:
    put:
      summary: Update project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /projects/delete:
    delete:
      summary: Delete project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        "204":
          description: Project deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /projects/get:
    post:
      summary: Get project by ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/list:
    post:
      summary: List projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
              properties:
                org_id:
                  type: string
                page:
                  type: integer
                page_size:
                  type: integer
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/get:
    post:
      summary: Get project settings
      description: |
        Project settings are stored in the server_config table (key: project_settings_{projectID}), are runtime, DB-backed, hot-reloadable, and immediately effective. All changes are auditable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                project_id:
                  type: string
      responses:
        "200":
          description: Project settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/update:
    put:
      summary: Update project settings
      description: |
        Project settings are stored in the server_config table (key: project_settings_{projectID}), are runtime, DB-backed, hot-reloadable, and immediately effective. All changes are auditable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - settings
              properties:
                project_id:
                  type: string
                settings:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Project settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreateRequest:
      type: object
      required:
        - org_id
        - name
      properties:
        org_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
    ProjectUpdateRequest:
      type: object
      required:
        - id
        - org_id
        - name
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
    ProjectSettings:
      type: object
      properties:
        project_id:
          type: string
        settings:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Unauthorized
    BadRequest:
      description: Bad request
    NotFound:
      description: Not found
    UnprocessableEntity:
      description: Unprocessable entity
