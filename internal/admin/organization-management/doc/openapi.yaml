openapi: 3.1.0
info:
  title: Organization Management API
  version: 1.0.0
  description: Production-grade API for SaaS organization management. All endpoints are secure, RBAC-protected, and auditable.
servers:
  - url: /api/v1/admin/organization-management
paths:
  /organizations/create:
    post:
      summary: Create organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /organizations/update:
    put:
      summary: Update organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdateRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /organizations/delete:
    delete:
      summary: Delete organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        "204":
          description: Organization deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /organizations/get:
    get:
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations/list:
    get:
      summary: List organizations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: owner_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/get:
    get:
      summary: Get org settings
      description: |
        Org settings are stored in the server_config table (key: org_settings_{orgID}), are runtime, DB-backed, hot-reloadable, and immediately effective. All changes are auditable.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Org settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/update:
    put:
      summary: Update org settings
      description: |
        Org settings are stored in the server_config table (key: org_settings_{orgID}), are runtime, DB-backed, hot-reloadable, and immediately effective. All changes are auditable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
                - settings
              properties:
                org_id:
                  type: string
                settings:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Org settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        owner_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationCreateRequest:
      type: object
      required:
        - name
        - slug
        - owner_id
      properties:
        name:
          type: string
        slug:
          type: string
        owner_id:
          type: string
    OrganizationUpdateRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
    OrgDomain:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        domain:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    OrgDomainCreateRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
    OrgMember:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        role:
          type: string
        status:
          type: string
        invited_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrgMemberCreateRequest:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
        role:
          type: string
    OrgInvite:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OrgInviteCreateRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
        role:
          type: string
    OrgSettings:
      type: object
      properties:
        org_id:
          type: string
        settings:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    OrgSettingsUpdateRequest:
      type: object
      required:
        - settings
      properties:
        settings:
          type: object
    OrgAuditLog:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_id:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Unauthorized
    BadRequest:
      description: Bad request
    NotFound:
      description: Not found
    UnprocessableEntity:
      description: Unprocessable entity
