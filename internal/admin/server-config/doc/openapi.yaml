openapi: 3.1.0
info:
  title: Server Config API
  version: 1.0.0
  description: |
    Production-grade API for SaaS server config management. All endpoints are secure, RBAC-protected, auditable, and versioned. All mutating endpoints are audit-logged. All endpoints require JWT/OIDC authentication.
servers:
  - url: /api/v1/admin
paths:
  /server-config/list:
    get:
      tags: [ServerConfig]
      summary: List all server config entries
      operationId: listServerConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of config entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerConfig"
              examples:
                example:
                  value:
                    - key: "feature_flag"
                      value: "true"
                      version: 3
                      updated_at: "2024-05-12T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /server-config/get/{key}:
    get:
      tags: [ServerConfig]
      summary: Get a server config entry by key
      operationId: getServerConfig
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Config entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
              examples:
                example:
                  value:
                    key: "feature_flag"
                    value: "true"
                    version: 3
                    updated_at: "2024-05-12T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /server-config/set:
    post:
      tags: [ServerConfig]
      summary: Set a server config entry (audit-logged)
      operationId: setServerConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: setConfig
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetConfigRequest"
            examples:
              example:
                value:
                  key: "feature_flag"
                  value: "false"
      responses:
        "200":
          description: Config entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
              examples:
                example:
                  value:
                    key: "feature_flag"
                    value: "false"
                    version: 4
                    updated_at: "2024-05-12T11:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /server-config/history/{key}:
    get:
      tags: [ServerConfig]
      summary: Get config history for a key
      operationId: getServerConfigHistory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Config history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerConfigHistory"
              examples:
                example:
                  value:
                    - id: 1
                      key: "feature_flag"
                      value: "true"
                      version: 1
                      updated_at: "2024-05-10T10:00:00Z"
                      updated_by: "admin"
                    - id: 2
                      key: "feature_flag"
                      value: "false"
                      version: 2
                      updated_at: "2024-05-11T10:00:00Z"
                      updated_by: "admin"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /server-config/migration-status:
    get:
      tags: [MigrationStatus]
      summary: List all migration statuses
      operationId: listMigrationStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of migration statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MigrationStatus"
              examples:
                example:
                  value:
                    - name: "init"
                      version: 1
                      status: "completed"
                      started_at: "2024-05-10T09:00:00Z"
                      completed_at: "2024-05-10T09:01:00Z"
                      error: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [MigrationStatus]
      summary: Set or update migration status (audit-logged)
      operationId: setMigrationStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: migrationStatus
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationStatus"
            examples:
              example:
                value:
                  name: "init"
                  version: 2
                  status: "completed"
                  started_at: "2024-05-12T09:00:00Z"
                  completed_at: "2024-05-12T09:01:00Z"
                  error: null
      responses:
        "200":
          description: Migration status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
              examples:
                example:
                  value:
                    name: "init"
                    version: 2
                    status: "completed"
                    started_at: "2024-05-12T09:00:00Z"
                    completed_at: "2024-05-12T09:01:00Z"
                    error: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /server-config/migration-status/{name}:
    get:
      tags: [MigrationStatus]
      summary: Get migration status by name
      operationId: getMigrationStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Migration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
              examples:
                example:
                  value:
                    name: "init"
                    version: 2
                    status: "completed"
                    started_at: "2024-05-12T09:00:00Z"
                    completed_at: "2024-05-12T09:01:00Z"
                    error: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ServerConfig:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    SetConfigRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    ServerConfigHistory:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    MigrationStatus:
      type: object
      properties:
        name:
          type: string
        version:
          type: integer
        status:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    Error:
      type: object
      description: Error response schema for all error cases.
      properties:
        error:
          type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "unauthorized"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "forbidden"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "bad request"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "not found"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "unprocessable entity"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: "internal server error"
