components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserIDRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
    PageRequest:
      type: object
      required:
        - page
        - page_size
      properties:
        page:
          type: integer
        page_size:
          type: integer
    SecurityEvent:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        event_type:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time
    LoginHistory:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        ip:
          type: string
        device:
          type: string
        location:
          type: string
        success:
          type: boolean
        created_at:
          type: string
          format: date-time
    PasswordResetRequest:
      type: object
      required:
        - user_id
        - new_password
      properties:
        user_id:
          type: string
        new_password:
          type: string
    AuditLogFilterRequest:
      type: object
      properties:
        actor_id:
          type: string
        action:
          type: string
        target_id:
          type: string
        page:
          type: integer
        page_size:
          type: integer
    SecurityAuditLog:
      type: object
      properties:
        id:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_id:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time
    APIKey:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        key:
          type: string
        created_at:
          type: string
          format: date-time
    APIKeyCreateRequest:
      type: object
      required:
        - user_id
        - name
      properties:
        user_id:
          type: string
        name:
          type: string
    APIKeyRevokeRequest:
      type: object
      required:
        - user_id
        - key_id
      properties:
        user_id:
          type: string
        key_id:
          type: string
    Device:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        device_type:
          type: string
        created_at:
          type: string
          format: date-time
    DeviceRevokeRequest:
      type: object
      required:
        - user_id
        - device_id
      properties:
        user_id:
          type: string
        device_id:
          type: string
    Breach:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        detected_at:
          type: string
          format: date-time
    SecurityPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    SecurityPolicyCreateRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
    SecurityPolicyUpdateRequest:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    SecurityPolicyDeleteRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    WebhookCreateRequest:
      type: object
    WebhookDeleteRequest:
      type: object
    WebhookTriggerRequest:
      type: object
    PasswordResetTokenRequest:
      type: object
    PasswordResetToken:
      type: object
    PasswordResetTokenVerifyRequest:
      type: object
    PasswordResetTokenUseRequest:
      type: object
    RateLimitSetRequest:
      type: object
    RateLimitConfig:
      type: object
    RateLimitDeleteRequest:
      type: object
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    EmailVerificationRequest:
      type: object
      required: [user_id, token]
      properties:
        user_id: { type: string }
        token: { type: string }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ChangePasswordRequest:
      type: object
      required: [user_id, old_password, new_password]
      properties:
        user_id: { type: string }
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserProfileUpdateRequest:
      type: object
      properties:
        email: { type: string, format: email }
    ConsentRequest:
      type: object
      required: [user_id, consent]
      properties:
        user_id: { type: string }
        consent: { type: string }
    InviteSendRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string }
    InviteAcceptRequest:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    DeviceTrustRequest:
      type: object
      required: [user_id, device_id]
      properties:
        user_id: { type: string }
        device_id: { type: string }
    AccountRecoveryRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    MFAChallengeRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    MFAChallengeResponse:
      type: object
      properties:
        challenge: { type: string }
        setup: { type: boolean }
    MFAVerifyRequest:
      type: object
      required: [user_id, code]
      properties:
        user_id: { type: string }
        code: { type: string }
    MFAConfig:
      type: object
    PasswordPolicyConfig:
      type: object
    SessionConfig:
      type: object
    NotificationChannelEnabledConfig:
      type: object
    AuthTypeConfigDB:
      type: object
      properties:
        tenant_id: { type: string }
        mfa_enabled: { type: boolean }
        password_enabled: { type: boolean }
        oauth_enabled: { type: boolean }
        saml_enabled: { type: boolean }
        auth_types: { type: array, items: { type: string } }
        primary: { type: string }
        fallback: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    OAuthConfigDB:
      type: object
      properties:
        tenant_id: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        redirect_uri: { type: string }
        scopes: { type: array, items: { type: string } }
    SAMLConfigDB:
      type: object
      properties:
        tenant_id: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        acs_url: { type: string }
    NotificationConfig:
      type: object
      properties:
        tenant_id: { type: string }
        channels: { type: array, items: { type: string } }
        recipients: { type: array, items: { type: string } }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
    ProviderConfig:
      type: object
      properties:
        tenant_id: { type: string }
        channel: { type: string }
        provider: { type: string }
        config: { type: object, additionalProperties: { type: string } }
  responses:
    Unauthorized:
      description: Unauthorized
    BadRequest:
      description: Bad request
    Forbidden:
      description: Forbidden
    NotFound:
      description: Not found
    UnprocessableEntity:
      description: Unprocessable entity
