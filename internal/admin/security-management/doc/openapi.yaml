  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA code
      operationId: mfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "204":
          description: MFA verified
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/sso/google:
    get:
      tags: [Auth]
      summary: Google OAuth start
      operationId: authGoogle
      responses:
        "302":
          description: Redirect to Google
  /auth/sso/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: authGoogleCallback
      responses:
        "200":
          description: OAuth callback handled
  /auth/sso/saml:
    get:
      tags: [Auth]
      summary: SAML start
      operationId: authSAML
      responses:
        "302":
          description: Redirect to SAML provider
  /auth/sso/saml/callback:
    get:
      tags: [Auth]
      summary: SAML callback
      operationId: authSAMLCallback
      responses:
        "200":
          description: SAML callback handled
