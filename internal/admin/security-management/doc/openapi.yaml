openapi: 3.1.0
info:
  title: Security Management API
  version: 1.0.0
  description: |
    All configuration, secrets, and feature flags are managed via the server_config service (DB-backed, hot-reloadable, multi-tenant). No static config files or direct DB columns are used for runtime config. All config endpoints read/write via server_config using key patterns (e.g., security_mfa_{tenantID}, provider_config_{channel}_{provider}_{tenantID}, etc.).
servers:
  - url: /api/v1/admin/security-management
paths:
  /users/security-events:
    post:
      tags: [SecurityEvents]
      summary: List user security events
      operationId: ListUserSecurityEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
      responses:
        "200":
          description: List of security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users/login-history:
    post:
      tags: [LoginHistory]
      summary: List user login history
      operationId: ListUserLoginHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
      responses:
        "200":
          description: List of login history
          content:
            application/json:
              schema:
                type: array
                items:
