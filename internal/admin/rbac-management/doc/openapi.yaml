components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RoleCreateRequest:
      type: object
      required:
        - tenant_id
        - name
      properties:
        tenant_id:
          type: string
        name:
          type: string
        desc:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        desc:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    RoleUpdateRequest:
      type: object
      required:
        - id
        - tenant_id
        - name
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        desc:
          type: string
    IDTenantRequest:
      type: object
      required:
        - id
        - tenant_id
      properties:
        id:
          type: string
        tenant_id:
          type: string
    ListRequest:
      type: object
      required:
        - page
        - page_size
      properties:
        page:
          type: integer
        page_size:
          type: integer
    PermissionCreateRequest:
      type: object
      required:
        - tenant_id
        - name
        - resource
        - action
      properties:
        tenant_id:
          type: string
        name:
          type: string
        resource:
