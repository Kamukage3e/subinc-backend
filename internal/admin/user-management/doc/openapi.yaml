openapi: 3.1.0
info:
  title: User Management API
  version: 1.0.0
  description: Production-grade API for SaaS user management. All endpoints are secure, RBAC-protected, rate-limited, and auditable.
servers:
  - url: /api/v1/admin/user-management
paths:
  /users/create:
    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: user
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            examples:
              default:
                value:
                  email: "user@example.com"
                  password: "strongpassword123"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  value:
                    id: "uuid"
                    email: "user@example.com"
                    status: "active"
                    created_at: "2024-01-01T00:00:00Z"
                    updated_at: "2024-01-01T00:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users/update:
    post:
      tags: [Users]
      summary: Update user
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: user
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            examples:
              default:
                value:
                  id: "uuid"
                  email: "new@example.com"
                  status: "active"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  value:
                    id: "uuid"
                    email: "new@example.com"
                    status: "active"
                    created_at: "2024-01-01T00:00:00Z"
                    updated_at: "2024-01-02T00:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users/delete:
    post:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: userId
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
            examples:
              default:
                value:
                  id: "uuid"
      responses:
        "204":
          description: User deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users/get:
    post:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: userId
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
            examples:
              default:
                value:
                  id: "uuid"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  value:
                    id: "uuid"
                    email: "user@example.com"
                    status: "active"
                    created_at: "2024-01-01T00:00:00Z"
                    updated_at: "2024-01-01T00:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/get-by-email:
    post:
      summary: Get user by email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEmailRequest"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/list:
    post:
      summary: List users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserListRequest"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profiles/create:
    post:
      summary: Create user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileCreateRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /profiles/update:
    post:
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /profiles/get:
    post:
      summary: Get user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/get:
    post:
      summary: Get user settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/update:
    post:
      summary: Update user settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdateRequest"
      responses:
        "200":
          description: User settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /sessions/create:
    post:
      summary: Create user session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /sessions/delete:
    post:
      summary: Delete user session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSessionIDRequest"
      responses:
        "204":
          description: Session deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /sessions/get:
    post:
      summary: Get user session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSessionIDRequest"
      responses:
        "200":
          description: User session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sessions/list:
    post:
      summary: List user sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserIDRequest"
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orgs/add-user:
    post:
      tags: [OrgMembership]
      summary: Add user to org
      description: Requires RBAC and rate-limiting. Only org admins can add users.
      operationId: addUserToOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: orgAddUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAddUserRequest"
            examples:
              default:
                value:
                  org_id: "org-uuid"
                  user_id: "user-uuid"
                  invited_by: "admin-uuid"
                  role: "member"
      responses:
        "204":
          description: User added to org
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /orgs/remove-user:
    post:
      tags: [OrgMembership]
      summary: Remove user from org
      description: Requires RBAC and rate-limiting. Only org admins can remove users.
      operationId: removeUserFromOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: orgRemoveUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgRemoveUserRequest"
            examples:
              default:
                value:
                  org_id: "org-uuid"
                  user_id: "user-uuid"
      responses:
        "204":
          description: User removed from org
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /orgs/list-users:
    post:
      tags: [OrgMembership]
      summary: List org users
      description: Requires RBAC and rate-limiting. Only org members can list users.
      operationId: listOrgUsers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: orgListUsers
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgListUsersRequest"
            examples:
              default:
                value:
                  org_id: "org-uuid"
                  page: 1
                  page_size: 50
      responses:
        "200":
          description: List of org users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  page:
                    type: integer
                  page_size:
                    type: integer
              examples:
                default:
                  value:
                    users:
                      - id: "user-uuid"
                        email: "user@example.com"
                        status: "active"
                        created_at: "2024-01-01T00:00:00Z"
                        updated_at: "2024-01-01T00:00:00Z"
                    page: 1
                    page_size: 50
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/invite-user:
    post:
      tags: [OrgInvites]
      summary: Invite user to org
      description: Requires RBAC and rate-limiting. Only org admins can invite users.
      operationId: inviteUserToOrg
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: orgInviteUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInviteUserRequest"
            examples:
              default:
                value:
                  org_id: "org-uuid"
                  email: "invitee@example.com"
                  invited_by: "admin-uuid"
                  role: "member"
      responses:
        "204":
          description: User invited to org
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /projects/add-user:
    post:
      tags: [ProjectMembership]
      summary: Add user to project
      description: Requires RBAC and rate-limiting. Only project admins can add users.
      operationId: addUserToProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: projectAddUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAddUserRequest"
            examples:
              default:
                value:
                  project_id: "project-uuid"
                  user_id: "user-uuid"
                  invited_by: "admin-uuid"
                  role: "contributor"
      responses:
        "204":
          description: User added to project
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /projects/remove-user:
    post:
      tags: [ProjectMembership]
      summary: Remove user from project
      description: Requires RBAC and rate-limiting. Only project admins can remove users.
      operationId: removeUserFromProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: projectRemoveUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRemoveUserRequest"
            examples:
              default:
                value:
                  project_id: "project-uuid"
                  user_id: "user-uuid"
      responses:
        "204":
          description: User removed from project
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /projects/list-users:
    post:
      tags: [ProjectMembership]
      summary: List project users
      description: Requires RBAC and rate-limiting. Only project members can list users.
      operationId: listProjectUsers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: projectListUsers
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectListUsersRequest"
            examples:
              default:
                value:
                  project_id: "project-uuid"
                  page: 1
                  page_size: 50
      responses:
        "200":
          description: List of project users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  page:
                    type: integer
                  page_size:
                    type: integer
              examples:
                default:
                  value:
                    users:
                      - id: "user-uuid"
                        email: "user@example.com"
                        status: "active"
                        created_at: "2024-01-01T00:00:00Z"
                        updated_at: "2024-01-01T00:00:00Z"
                    page: 1
                    page_size: 50
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/invite-user:
    post:
      tags: [ProjectInvites]
      summary: Invite user to project
      description: Requires RBAC and rate-limiting. Only project admins can invite users.
      operationId: inviteUserToProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        x-codegen-request-body-name: projectInviteUser
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInviteUserRequest"
            examples:
              default:
                value:
                  project_id: "project-uuid"
                  email: "invitee@example.com"
                  invited_by: "admin-uuid"
                  role: "contributor"
      responses:
        "204":
          description: User invited to project
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    UserUpdateRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        email:
          type: string
        status:
          type: string
    UserIDRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    UserEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    UserListRequest:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfileCreateRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
    UserProfileUpdateRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
        full_name:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
    UserSettings:
      type: object
      properties:
        user_id:
          type: string
        settings:
          type: object
        updated_at:
          type: string
          format: date-time
    UserSettingsUpdateRequest:
      type: object
      required:
        - user_id
        - settings
      properties:
        user_id:
          type: string
        settings:
          type: object
    UserSession:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    UserSessionCreateRequest:
      type: object
      required:
        - user_id
        - expires_at
      properties:
        user_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        expires_at:
          type: string
          format: date-time
    UserSessionIDRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    OrgAddUserRequest:
      type: object
      required:
        - org_id
        - user_id
        - invited_by
        - role
      properties:
        org_id:
          type: string
        user_id:
          type: string
        invited_by:
          type: string
        role:
          type: string
    OrgRemoveUserRequest:
      type: object
      required:
        - org_id
        - user_id
      properties:
        org_id:
          type: string
        user_id:
          type: string
    OrgListUsersRequest:
      type: object
      required:
        - org_id
      properties:
        org_id:
          type: string
        page:
          type: integer
        page_size:
          type: integer
    OrgInviteUserRequest:
      type: object
      required:
        - org_id
        - email
        - invited_by
        - role
      properties:
        org_id:
          type: string
        email:
          type: string
        invited_by:
          type: string
        role:
          type: string
    ProjectAddUserRequest:
      type: object
      required:
        - project_id
        - user_id
        - invited_by
        - role
      properties:
        project_id:
          type: string
        user_id:
          type: string
        invited_by:
          type: string
        role:
          type: string
    ProjectRemoveUserRequest:
      type: object
      required:
        - project_id
        - user_id
      properties:
        project_id:
          type: string
        user_id:
          type: string
    ProjectListUsersRequest:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string
        page:
          type: integer
        page_size:
          type: integer
    ProjectInviteUserRequest:
      type: object
      required:
        - project_id
        - email
        - invited_by
        - role
      properties:
        project_id:
          type: string
        email:
          type: string
        invited_by:
          type: string
        role:
          type: string
  responses:
    Unauthorized:
      description: Unauthorized
    BadRequest:
      description: Bad request
    NotFound:
      description: Not found
    UnprocessableEntity:
      description: Unprocessable entity
    Forbidden:
      description: Forbidden
